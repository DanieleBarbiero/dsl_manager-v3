[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dslm3"
version = "3.0.0"
description = "DSL Manager: evidenze, conoscenza governata e temporalità, con UI web locale."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "docling==2.128.0", "opencv-python==4.12.0.88", "numpy==2.2.6", "fastapi==0.141.1", "uvicorn>=0.30,<1",
  "python-multipart>=0.0.18", "sqlglot==30.18.0", "sqlparse>=0.5,<1",
  "openpyxl>=3.1,<4", "xlrd>=2,<3", "pyxlsb>=1,<2", "odfpy>=1.4",
  "httpx[socks]>=0.28,<1", "PyYAML>=6,<7", "charset-normalizer>=3,<4", "defusedxml>=0.7,<1", "lxml>=6,<7",
  "psutil>=6,<8", "tzdata>=2025.1", "beautifulsoup4>=4.12,<5"
]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "playwright==1.56.0", "build>=1", "ruff>=0.12", "xlwt==1.3.0", "python-pptx>=1", "jsbeautifier>=1.15"]
[project.scripts]
dslm3 = "dslm3.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
dslm3 = ["static/*", "resources/gexf/*", "resources/vega/**/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
