      evidence_id: EV_e66cb31f395ded6fc2dcb0b6
      evidence_text: "CREATE PROCEDURE PRC_PRENOTA_ARTICOLO (\n    P_ID_RICHIESTA\
        \ IN NUMBER\n) AS\nBEGIN\n    UPDATE RICHIESTA_RICAMBIO\n       SET STATO\
        \ = 'PRENOTATA'\n     WHERE ID_RICHIESTA = P_ID_RICHIESTA;\n\n    UPDATE ARTICOLO\n\
        \       SET QTA_DISPONIBILE = QTA_DISPONIBILE - 1\n     WHERE ID_ARTICOLO\
        \ = (\n        SELECT ID_ARTICOLO\n          FROM RICHIESTA_RICAMBIO\n   \
        \      WHERE ID_RICHIESTA = P_ID_RICHIESTA\n     );\nEND;"
      evidence_text_hash: a690468510bb5e7028ae7b42baf6bc43c058b43753294618a5ccc203b337c90b
      rule: sql_unit
      temporal_evidence_ids: []
